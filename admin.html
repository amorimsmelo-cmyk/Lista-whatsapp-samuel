<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central Samuel — Administração</title><style>body{font-family:Arial;background:#f4f6fb;color:#14213d;margin:0}.w{max-width:1100px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e3e8f2;border-radius:16px;padding:18px;margin-bottom:14px}h1{margin:0 0 5px}p{color:#667085}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #e9edf4}th{font-size:12px;color:#667085}input,button{padding:11px;border-radius:10px;border:1px solid #ccd5e4}button{background:#0d1b4c;color:#fff;font-weight:700;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.k{font-size:28px;font-weight:800}.hide{display:none}@media(max-width:700px){.w{padding:12px}.scroll{overflow:auto}}</style></head><body><div class="w"><div class="card"><h1>Painel administrativo</h1><p>Relatório de confirmações registradas na Central. Não representa confirmação técnica de entrega pelo WhatsApp.</p><div id="login"><div class="row"><input id="email" type="email" placeholder="E-mail administrativo"><input id="password" type="password" placeholder="Senha"><button id="enter">Entrar</button></div><p id="msg"></p></div><div id="dash" class="hide"><div class="row"><div class="card"><div class="k" id="total">0</div><small>confirmados hoje</small></div><button id="out">Sair</button></div><div class="scroll"><table><thead><tr><th>Operador</th><th>Identificação</th><th>Confirmados hoje</th><th>Pulados</th><th>Não contatar</th><th>Última atividade</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div><script>
const BASE='https://wsqcjbbaqxsjvxvvlgxv.supabase.co',KEY='sb_publishable_81ikpTrCLUMeJFlJjn_x1w_3p4DGrBj';let token='';
const H=()=>({'apikey':KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'});
async function login(){let r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});let j=await r.json();if(!r.ok){msg.textContent='Não foi possível entrar.';return}token=j.access_token;await load()}
async function load(){let me=await fetch(BASE+'/rest/v1/whatsapp_operators?select=id,role,display_name&user_id=eq.'+(await uid()),{headers:H()});let m=await me.json();if(!m[0]||m[0].role!=='admin'){msg.textContent='Esta conta não possui acesso administrativo.';return}loginDiv();let today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo'}).format(new Date());let r=await fetch(BASE+'/rest/v1/whatsapp_daily_operator_summary?select=*&activity_date=eq.'+today+'&order=display_name',{headers:H()});let a=await r.json();total.textContent=a.reduce((s,x)=>s+Number(x.sent_confirmed||0),0);rows.innerHTML=a.map(x=>'<tr><td>'+e(x.display_name)+'</td><td>'+e(x.phone_label||'—')+'</td><td>'+Number(x.sent_confirmed||0)+'</td><td>'+Number(x.skipped||0)+'</td><td>'+Number(x.do_not_contact||0)+'</td><td>'+(x.last_activity?new Date(x.last_activity).toLocaleString('pt-BR'):'—')+'</td></tr>').join('')}
async function uid(){let r=await fetch(BASE+'/auth/v1/user',{headers:H()}),j=await r.json();return j.id}
function loginDiv(){document.getElementById('login').classList.add('hide');dash.classList.remove('hide')}function e(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
enter.onclick=login;out.onclick=()=>location.reload();
</script></body></html>
